name: Build and release signed iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-ipa:
    name: Build, sign, and publish Ad Hoc IPA
    runs-on: macos-15
    timeout-minutes: 120
    env:
      BUNDLE_ID: com.DefaultCompany.DragonBoy9
      XCODE_PROJECT: Unity-iPhone.xcodeproj
      XCODE_SCHEME: Unity-iPhone

    steps:
      - name: Check out repository and Git LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Unity iOS library from Git LFS
        run: git lfs pull --include="Libraries/libiPhone-lib.a"

      - name: Prepare Unity IL2CPP tools
        run: |
          set -euo pipefail
          chmod +x Il2CppOutputProject/IL2CPP/build/deploy_*/il2cpp
          find Il2CppOutputProject/IL2CPP/build -name bee_backend -type f -exec chmod +x {} \;

      - name: Install Apple signing assets from repository secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${IOS_CERTIFICATE_BASE64:-}" || -z "${IOS_CERTIFICATE_PASSWORD:-}" || -z "${IOS_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            echo "Add IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD, and IOS_PROVISIONING_PROFILE_BASE64 in GitHub Actions secrets before running this workflow." >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ios-signing"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          out = Path(os.environ["RUNNER_TEMP"]) / "ios-signing"
          (out / "distribution.p12").write_bytes(base64.b64decode(os.environ["IOS_CERTIFICATE_BASE64"], validate=True))
          (out / "profile.mobileprovision").write_bytes(base64.b64decode(os.environ["IOS_PROVISIONING_PROFILE_BASE64"], validate=True))
          PY

          security cms -D -i "$RUNNER_TEMP/ios-signing/profile.mobileprovision" > "$RUNNER_TEMP/ios-signing/profile.plist"
          python3 - <<'PY'
          import os
          import plistlib
          from datetime import datetime, timezone
          from pathlib import Path

          profile = plistlib.loads((Path(os.environ["RUNNER_TEMP"]) / "ios-signing/profile.plist").read_bytes())
          bundle_id = os.environ["BUNDLE_ID"]
          team_ids = profile.get("TeamIdentifier", [])
          team_id = team_ids[0] if team_ids else ""
          app_id = profile.get("Entitlements", {}).get("application-identifier", "")
          if not team_id or app_id != f"{team_id}.{bundle_id}":
              raise SystemExit(f"Provisioning profile app ID {app_id!r} does not match {bundle_id!r}; use a profile from your team for this app.")
          if profile.get("ProvisionsAllDevices") or not profile.get("ProvisionedDevices"):
              raise SystemExit("This workflow requires an Ad Hoc profile with registered device UDIDs.")
          if profile.get("Entitlements", {}).get("get-task-allow", True):
              raise SystemExit("The provisioning profile must be a distribution profile, not a development profile.")
          expiration = profile.get("ExpirationDate")
          if expiration and expiration.tzinfo is None:
              expiration = expiration.replace(tzinfo=timezone.utc)
          if not expiration or expiration <= datetime.now(timezone.utc):
              raise SystemExit("The provisioning profile is missing or expired.")
          print(f"Validated Ad Hoc profile for {bundle_id} (team {team_id}).")
          PY

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/ios-signing/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/ios-signing/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/ios-signing/distribution.p12" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          IDENTITY_OUTPUT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
          if ! grep -q '1 valid identities found' <<< "$IDENTITY_OUTPUT"; then
            echo "The .p12 file did not import a valid code-signing identity." >&2
            exit 1
          fi

      - name: Install Codemagic Xcode signing helper
        run: |
          python3 -m venv "$RUNNER_TEMP/codemagic-venv"
          "$RUNNER_TEMP/codemagic-venv/bin/pip" install --disable-pip-version-check codemagic-cli-tools
          echo "$RUNNER_TEMP/codemagic-venv/bin" >> "$GITHUB_PATH"

      - name: Apply provisioning profile to Xcode project
        run: xcode-project use-profiles --project "$GITHUB_WORKSPACE/$XCODE_PROJECT"

      - name: Build and export signed IPA
        run: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$GITHUB_WORKSPACE/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
          IPA_SOURCE=$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)
          if [[ -z "$IPA_SOURCE" ]]; then
            echo "The Xcode archive did not produce an IPA." >&2
            exit 1
          fi
          cp "$IPA_SOURCE" build/ios/ipa/ChienBinhVegeta.ipa

      - name: Verify signed app and embedded profile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa-verify"
          ditto -x -k build/ios/ipa/ChienBinhVegeta.ipa "$RUNNER_TEMP/ipa-verify"
          APP_PATH=$(find "$RUNNER_TEMP/ipa-verify/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          test -f "$APP_PATH/embedded.mobileprovision"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          APP_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          test "$APP_BUNDLE_ID" = "$BUNDLE_ID"
          echo "Verified signed IPA for $APP_BUNDLE_ID."

      - name: Upload IPA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChienBinhVegeta-signed-IPA
          path: build/ios/ipa/ChienBinhVegeta.ipa
          if-no-files-found: error

      - name: Publish public GitHub Release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vegeta-ios-${GITHUB_RUN_ID}"
          gh release create "$TAG" build/ios/ipa/ChienBinhVegeta.ipa \
            --title "Chiến Binh Vegeta iOS build ${GITHUB_RUN_NUMBER}" \
            --notes "Signed Ad Hoc IPA for registered devices. Install only on devices included in the provisioning profile."
